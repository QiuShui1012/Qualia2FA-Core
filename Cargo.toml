[package]
name = "qualia2fa-core"
version = "0.1.0"
edition = "2024"
# MSRV 策略：1.89 是「最低支持」的声明，不是开发工具链版本。
# 开发工具链由 rust-toolchain.toml 固定为 stable（当前 1.99）。
# 1.89 的下限由后续要引入的 crypto 栈决定（最紧的是 aes 0.9.3）；
# 本 crate 自身的代码用 1.85 即可编译，故意留出余量以便上游收紧时不被迫跳版。
rust-version = "1.89"
description = "Qualia2FA 核心库：TOTP/HOTP 原语、加密保险库与设备同步逻辑"
license = "LGPL-3.0-or-later"

# 真实仓库地址。本仓库预期被 UI 端以 git submodule 引入，
# `cargo doc` 与未来的 `cargo publish`（当前 `publish = false`）都要用它。
repository = "https://github.com/QiuShui1012/Qualia2FA-Core"
readme = "README.md"
keywords = ["2fa", "totp", "hotp", "otp", "authentication"]
categories = ["authentication", "cryptography"]
publish = false

[dependencies]
# ── 恢复密钥的口令派生 ────────────────────────────────────────────────────
# Argon2id（RFC 9106），用于把用户口令变成恢复文件的加密密钥。
#
# 为什么是 Argon2id 而不是 PBKDF2/scrypt：恢复文件会被用户存进网盘、U 盘、
# 邮件附件，必须假设攻击者拿得到文件本身，唯一的防线就是口令强度。PBKDF2
# 是纯计算型，GPU 并行破解的收益极高；scrypt 内存硬但参数组合（N/r/p）容易
# 被配成「看起来贵其实不贵」；Argon2id 是密码哈希竞赛的获胜者、RFC 9106 推荐，
# 且同时抵抗 GPU 与侧信道（id 变体混合了数据相关与数据无关的内存访问）。
#
# `password-hash` 无法关闭：argon2 0.6 的 lib.rs 无条件 `use password_hash::...`，
# 该 feature 是实质必选项（尽管 Cargo.toml 把它列为可选）。它只带来 base64ct
# 与一个小工具 crate，代价可接受。
#
# 开启 `zeroize`：让库内部的工作区（Argon2 的内存块）在析构时被擦除。默认参数
# 一次要分配 64 MiB，不擦除等于把口令的派生中间态留在堆上。
#
# 不开 `parallel`：并行度固定为 1，理由见 src/recovery.rs 的 PARALLELISM。
argon2 = { version = "0.6.0", features = ["zeroize"] }
# ── 认证加密 ──────────────────────────────────────────────────────────────
# 保险库条目用 XChaCha20-Poly1305（RFC 8439 的 192-bit nonce 变体）。
#
# 为什么必须是 192-bit nonce 而不是常见的 96-bit：多设备各自独立加密、彼此
# 无中心协调，随机 nonce 是唯一现实选择。96-bit nonce 在随机取值下会撞生日界
# （保险库规模下 `aes-gcm` 属于**不安全用法**）；192-bit 的随机 nonce 余量充足。
# 另外 ChaCha 系列不依赖 AES-NI 硬件，在任何平台上行为一致。
#
# 推荐加密（RustCrypto 系），实现为纯 Rust，无 C/汇编依赖，交叉编译到
# Android / iOS 不需要额外的工具链配置。
chacha20poly1305 = "0.11.0"

form_urlencoded = "1.2"
# 随机数只走 getrandom（OS CSPRNG），不经任何用户态 PRNG。
# Android 上该 syscall 需 API 23；aarch64/arm/x86/x86_64 在更低版本有 /dev/urandom 回退。
getrandom = "0.4.3"

# ── 子密钥派生 ────────────────────────────────────────────────────────────
# HKDF-SHA256（RFC 5869），用于从主密钥派生用途分离的子密钥。
#
# 这里**刻意不用 blake3**：blake3 会为每个目标平台编译 C 与手写汇编，
# 在 Android 的交叉编译矩阵上引入额外的构建风险，而本项目只需要一个标准 KDF。
# `hkdf` 是纯 Rust，且与已有的 `hmac` 同属 RustCrypto、同为 0.13 系列，
# 不会引入第二份 `digest`/`hmac` 版本。
#
# 派生子密钥而非直接用主密钥加密，是为了让主密钥**不出现在任何密文的密钥
# 位置**：主密钥将来还要参与设备配对与恢复（M3/M4），用途分离能限制单点泄露
# 的影响范围。
hkdf = "0.13"

hmac = "0.13"

# ── 设备身份（ECDSA P-256 验签） ──────────────────────────────────────────
# 只用于**验签**，不用于签名：设备私钥住在平台硬件里，签名由
# `qualia2fa-keystore` 发起。验证则必须能被任何设备执行，包括那些自己根本不
# 持有硬件密钥的设备，所以它属于核心库。
#
# 版本必须留在 0.14。它的 `ecdsa` feature 依赖 `sha2 ^0.11`，与本库**同代**，
# 因而不产生第二份 SHA-2。`p256 0.13`（例如 `hardware-enclave` 用的那个）依赖
# `sha2 ^0.10`，一旦混用，二进制里就会出现两份 SHA-2 与两套互不兼容的 P-256
# 类型。那不只是体积问题：两份实现意味着「常量时间」这类性质要在两处分别论证，
# 而我们无法对其中任何一处给出保证。
#
# 关掉 default features 再显式开 `ecdsa`：默认集里的 `pem` 会拉进 `pkcs8` 与
# `elliptic-curve/pem`，而我们的线格式只有 SEC1 未压缩点与原始 r||s 两种，
# 都不需要 PEM。
#
# `ecdh` 用于 M3 的配对密钥协商（见 `src/pairing.rs`）。**刻意复用 P-256 而不是
# 引入 X25519**：P-256 的余因子是 1，不存在小阶点，因此 ECDH 结果不像 X25519
# 那样需要靠「检查输出是否全零」来防小阶点攻击——少一条容易漏掉的检查，也少一份
# 需要额外审计的椭圆曲线实现。代价是标量乘法比 X25519 慢，而一次配对只做两次，
# 完全可以忽略。
#
# 曲线选择见 `src/device.rs` 的模块文档：P-256 是两个移动平台上**唯一**能进
# 硬件的签名算法，这是强约束而非偏好。
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }

# 秘密材料容器（`SecretBox` / `SecretSlice` / `SecretString` / `ExposeSecret`）。
# 依赖审计（人工逐项核过，cargo-deny 不做依赖必要性判断）：
#   - 唯一必需依赖是 `zeroize ^1.6`，与本 crate 原先所用版本同一 major，
#     不会产生重复版本（`cargo tree` 实证全树只有一个 zeroize）。
#   - 可选依赖 `serde ^1` 本 crate 不启用，故不进依赖树。
#   - 上游 monorepo `iqlusioninc/crates` 活跃（未归档、近期有推送）；
#     crate 本身自 2024-10 无新版本，属「成熟稳定」而非「废弃」，且实现为
#     纯逻辑封装（无 unsafe、无 FFI）。库内**仅 src/secret.rs 接触它**，
#     以便必要时整体替换。详见仓库外的 TODO.md §4.3。
secrecy = "0.10.3"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"

# 库公共 API 的错误类型一律用 thiserror；`anyhow` 禁止进入库的对外签名。
thiserror = "2.0.21"

# 刻意**不**直接依赖 `zeroize`：它已由 `secrecy` 传递引入，且 `secrecy`
# 自行 `pub use zeroize`，需要用到 `Zeroize` trait 时从 `secrecy::zeroize` 取。
# 避免直接依赖可防止与 secrecy 的版本要求各自漂移。若将来出现 secrecy 未覆盖
# 的秘密类型（需自行实现 Drop 擦除），再显式加回并同时开启其 `derive` 特性。

[dev-dependencies]
# 基于属性的测试。用于验证「对任意输入都成立」的性质，
# 与 fuzz（fuzz/ 目录，找 panic 与内存问题）分工不同，两者都要有。
proptest = "1.12.0"
