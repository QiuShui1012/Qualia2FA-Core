name: CI

# Note: the repository root is `Core/` (crate `qualia2fa-core`), so every job sets
# `working-directory: .` (that is, the repository root) explicitly and the `paths`
# filters need no prefix.
#
# Core tenet: CI must stop cryptographic code that merely looks right, so besides the
# usual fmt/clippy/test there are dependency audit and MSRV gates.

# A branch pushed inside this repository starts **two** runs for the same commit: one for
# the `push` and one for the `pull_request`. Only the second one is about the change under
# review, so `push` is limited to `master` and every other change arrives through its pull
# request. Branches in forks never produce a `push` run to begin with.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels the older run instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Make CI build results reproducible: no implicit download of new versions, no
  # lockfile rewriting.
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # ── Gate 1: formatting, lint, tests ────────────────────────────────────
  check:
    name: fmt + clippy + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7


      - name: Install the toolchain (channel from rust-toolchain.toml)
        run: rustup show

      - name: Cache the build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Key point: --locked makes CI use exactly the versions committed to the
      # repository. If someone upgrades a dependency locally without committing
      # Cargo.lock, this fails outright.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test (proptest and doc tests included)
        run: cargo test --locked --all-targets

      - name: cargo doc (verify doc links and intra-doc links)
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Gate 2: MSRV ──────────────────────────────────────────────────────
  # The rust-version declared in Cargo.toml must actually compile, or the declaration
  # is a lie: downstream users would hit the problem and no local run would reveal it.
  msrv:
    name: MSRV 1.89
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7


      - name: Install the 1.89 toolchain
        run: rustup toolchain install 1.89 --profile minimal

      # Note: --locked may fail under the MSRV because a dependency raised its own MSRV,
      # which is exactly the signal wanted here: the rust-version in Cargo.toml must be
      # raised, or some dependency must be downgraded.
      - name: Compile with 1.89
        run: cargo +1.89 check --all-targets

  # ── Gate 3: dependency security audit ─────────────────────────────────
  # Basis: the RustSec database added 334 advisories in 2026 (172 in 2025), and every
  # serious problem in this project's crypto dependencies was fixed in a patch or minor
  # release. Dependency auditing is therefore a security control, not an option.
  deny:
    name: cargo-deny (dependency audit + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Make cargo-deny use the repository's deny.toml and Cargo.lock
          arguments: --all-features

  # ── Gate 4: fuzz smoke run ────────────────────────────────────────────
  # Only a bounded number of rounds: CI cannot fuzz for long, but a short run catches
  # obvious panics and keeps the fuzz targets compiling instead of rotting away.
  fuzz-smoke:
    name: fuzz smoke run (time-boxed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Install nightly (cargo-fuzz needs -Zsanitizer)
        run: rustup toolchain install nightly --component rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run every fuzz target for 60 seconds
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $target"
            # Seed the corpus with the checked-in regression inputs first.
            #
            # These are inputs that really did trigger a crash (or a failed assertion),
            # so they must run every round or the same defect would quietly return. The
            # generated corpus/ is not checked in and therefore starts empty each time;
            # regressions/ is the only durable guarantee.
            if [ -d "regressions/$target" ]; then
              mkdir -p "corpus/$target"
              cp -n "regressions/$target"/* "corpus/$target"/ 2>/dev/null || true
            fi
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
